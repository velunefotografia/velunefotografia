<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velune</title>
<meta name="description" content="Afeto e memórias">
<meta property="og:title" content="Velune">
<meta property="og:description" content="Afeto e memórias">
<meta property="og:site_name" content="Velune">
<meta property="og:type" content="website">
<meta property="og:url" content="https://velunefotografia.github.io/velunefotografia/">
<meta property="og:image" content="https://velunefotografia.github.io/velunefotografia/assets/og-image.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Velune — Afeto e memórias">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://velunefotografia.github.io/velunefotografia/assets/og-image.jpg?v=2">
<meta name="twitter:title" content="Velune">
<meta name="twitter:description" content="Afeto e memórias">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&amp;family=Libre+Caslon+Display&amp;family=Libre+Franklin:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
html{scroll-behavior:smooth}
a{color:#28333E}a:hover{color:#28333E}
.v{font-family:'Libre Franklin',system-ui,sans-serif;font-size:14px;line-height:1.6;color:#28333E;background:#FFFFFF;overflow-x:clip;-webkit-font-smoothing:antialiased}
.v *{box-sizing:border-box}
.v img{display:block;max-width:100%}
.serif{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400}
.hand{font-family:'Caveat',cursive;font-weight:400}
.mute{color:#28333E}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{padding-inline:clamp(20px,3.4vw,48px)}
.ph{overflow:hidden;position:relative;background:#E4DCD1}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.tone-pb .ph img,.tone-pb .slide img,.tone-pb .gal-stage img{filter:grayscale(1)}
.lnk{text-decoration:none;color:#28333E;padding:12px 0}
.lnk:hover{color:#28333E}

/* header */
.hdr{position:sticky;top:0;z-index:30;height:52px;font-size:13px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#FFFFFF;border-bottom:1px solid rgba(228,220,209,.4)}
.hdr .l{display:flex;gap:28px}
.hdr .r{display:flex;gap:28px;justify-content:flex-end}
.hdr .logo img{height:16px;width:auto}
.menu-btn{display:none;background:none;border:0;padding:0;min-height:44px;min-width:44px;cursor:pointer;color:#28333E;font:400 14px 'Libre Franklin',sans-serif;text-align:right}
.mnav{position:fixed;inset:0;z-index:60;background:#FFFFFF;display:flex;flex-direction:column;padding:16px clamp(20px,6vw,40px) 32px;animation:fade .4s ease both}
.mnav a.big{font-family:'Libre Caslon Display',Georgia,serif;font-size:38px;line-height:1.3;text-decoration:none;display:block;padding:4px 0}

/* hero — ref 2 */
.hero{position:relative;height:calc(100vh - 52px);min-height:560px;max-height:1100px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:32px;padding-bottom:40px}
.hero .side{align-self:center}
.hero .side.r{justify-self:end;text-align:right}
.stage{position:relative;height:min(calc(100vh - 196px),860px);min-height:440px;aspect-ratio:4/5.2}
.slide{position:absolute;inset:0;transition:opacity 1.6s ease}
.slide img{width:100%;height:100%;object-fit:cover}
.hero-h{font-size:21px;line-height:1.3;margin:0;max-width:15ch}
.hero-sub{margin:14px 0 0;max-width:24ch}
.dots{position:absolute;left:0;right:0;bottom:-30px;display:flex;justify-content:center;gap:4px}
.dot{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot i{display:block;width:16px;height:1px;background:#9EB3B2;transition:background-color .4s ease,width .4s ease}
.dot.on i{background:#28333E;width:24px}

/* collage — ref 1 */
.sec{padding-block:clamp(96px,12vw,180px)}
.collage{position:relative;max-width:1180px;margin:0 auto;aspect-ratio:16/10.4}
.collage .it{position:absolute}
.collage .cap{position:absolute;left:24%;top:2%;font-size:14px}
.i1{left:6%;top:42%;width:17%}.i1 .ph{aspect-ratio:4/5.2}
.i2{left:24%;top:9%;width:31%;z-index:1}.i2 .ph{aspect-ratio:4/5.2}
.i3{left:53%;top:24%;width:18%;z-index:2}.i3 .ph{aspect-ratio:3/4.6}
.i4{left:69%;top:4%;width:17%}.i4 .ph{aspect-ratio:1/1.3}
.manifesto{max-width:520px;margin:clamp(72px,9vw,140px) auto 0;text-align:center}
.manifesto h2{font-size:clamp(26px,2.4vw,34px);line-height:1.2;margin:0 0 24px}
.manifesto p{margin:0 0 14px;color:#28333E}

/* portfolio — ref 1 rhythm */
.pf-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.cats{display:flex;gap:22px;flex-wrap:wrap}
.card{display:block;text-decoration:none;color:#28333E}
.card:hover .ph img,.card:focus-visible .ph img{transform:scale(1.03)}
.card .t{display:flex;justify-content:space-between;gap:16px;margin-top:12px}
.card .t span:first-child{font-family:'Libre Caslon Display',Georgia,serif;font-size:19px;line-height:1.3}
.card .t span:last-child{color:#28333E;font-size:13px}
.bleed{margin-inline:calc(-1 * clamp(20px,3.4vw,48px))}
.bleed .ph{aspect-ratio:2/1;max-height:92vh;width:100%}
.bleed .t{padding-inline:clamp(20px,3.4vw,48px)}
.bleed .ph::after{content:"";position:absolute;inset:0;background:rgba(40,51,62,.22);pointer-events:none}
.write{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hw{width:clamp(160px,15vw,240px);height:auto;overflow:visible}
.hw .glyph{fill:#FFFFFF}
.hw .ink{fill:none;stroke:#FFFFFF;stroke-width:150;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:hw-ink .7s cubic-bezier(.4,0,.3,1) forwards}
@keyframes hw-ink{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.hw .ink{animation:none;stroke-dashoffset:0}}

.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(12px,2vw,32px);margin-top:clamp(96px,12vw,180px);align-items:start}
.p2{grid-column:7/12}.p2 .ph{aspect-ratio:2/2.9}
.p3{grid-column:2/5;grid-row:1;margin-top:clamp(80px,9vw,140px)}.p3 .ph{aspect-ratio:3/4}
.p4{grid-column:2/8}.p4 .ph{aspect-ratio:4/5}
.p4note{grid-column:9/12;align-self:end;margin-bottom:40px}

/* pause */
.pause .ph{height:clamp(420px,88vh,940px)}
.pause .q{text-align:center;font-size:clamp(24px,2.4vw,34px);line-height:1.2;margin:clamp(40px,5vw,64px) auto 0;max-width:22ch}

/* about — centered editorial */
.about{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:clamp(96px,12vw,180px)}
.about .ab-k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin:0 0 28px}
.about .ab-img{width:clamp(220px,24vw,340px);aspect-ratio:2/3;overflow:hidden;background:#E4DCD1}
.about .ab-img img{width:100%;height:100%;object-fit:cover;object-position:55% 40%}
.tone-pb .about .ab-img img{filter:grayscale(1)}
.about .ab-t{font-family:'Libre Franklin',sans-serif;font-weight:400;font-size:clamp(18px,1.6vw,22px);letter-spacing:.24em;text-transform:uppercase;margin:clamp(48px,5vw,72px) 0 0}
.about .ab-name{font-size:clamp(22px,2vw,28px);margin:28px 0 0}
.about .ab-p{max-width:44ch;font-size:15px;line-height:1.75;margin:12px 0 0}
.about .ab-sig{font-size:clamp(28px,2.4vw,36px);margin:16px 0 0;align-self:center;transform:translateX(clamp(40px,8vw,120px)) rotate(-4deg)}


/* hero slider */
.hero-sl{position:relative;height:calc(100vh - 52px);min-height:520px;max-height:1000px;overflow:hidden;background:#E4DCD1}
.hero-sl .sl{position:absolute;inset:0;transition:opacity 1.6s ease}
.hero-sl .sl img{width:100%;height:100%;object-fit:cover}
.hero-sl .shade{position:absolute;inset:0;background:rgba(40,51,62,.22);pointer-events:none;z-index:1}
.hero-sl .write{z-index:2}
.hero-sl .dots{bottom:20px;z-index:3}
.hero-sl .dot i{background:rgba(255,255,255,.55)}
.hero-sl .dot.on i{background:#FFFFFF}
.pf-more{grid-column:9/12;align-self:end;margin-bottom:40px;display:flex;flex-direction:column;gap:12px}
.pf-more .serif{font-size:clamp(22px,2vw,28px);line-height:1.2}
@media (max-width:760px){.hero-sl{height:72vh;min-height:420px}.pf-more{margin:24px 0 0}}
@media (prefers-reduced-motion: reduce){.hero-sl .sl{transition:none}}


/* pause slider (framed) */
.pause{padding-block:clamp(32px,4vw,56px) clamp(56px,7vw,96px)}
.pause .pz{position:relative;height:clamp(380px,78vh,860px);overflow:hidden;background:#E4DCD1}
.pause .sl{position:absolute;inset:0;transition:opacity 1.6s ease}
.pause .sl img{width:100%;height:100%;object-fit:cover}
.pause .dots{position:static;margin-top:16px}
@media (prefers-reduced-motion: reduce){.pause .sl{transition:none}}

/* contact */
.ct{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(12px,2vw,32px);align-items:end}
.ct .img{grid-column:1/5}.ct .img .ph{aspect-ratio:4/5}
.ct .txt{grid-column:6/13}
.ct .k{font-size:12px;letter-spacing:.04em;color:#28333E}
.ct h2{font-size:clamp(40px,4.8vw,76px);line-height:1.04;letter-spacing:-.01em;margin:16px 0 0;max-width:13ch}
.ct p{margin:24px 0 0;color:#28333E;max-width:40ch}
.ct .go{display:inline-flex;align-items:center;gap:12px;margin-top:36px;font-family:'Libre Caslon Display',Georgia,serif;font-size:clamp(20px,1.8vw,26px);padding:8px 0}
.ct .go .arr{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ct .go:hover .arr{transform:translateX(6px)}
.ct-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(56px,6vw,96px);border-top:1px solid rgba(228,220,209,.6)}
.ct-list div{display:flex;flex-direction:column;gap:6px;padding:20px 20px 0 0;font-size:12px;color:#28333E}
.ct-list a{text-decoration:none;font-size:15px;color:#28333E;width:fit-content;padding:4px 0}

/* footer */
.ft{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:52px;padding-block:8px;flex-wrap:wrap;font-size:12px;color:#28333E;border-top:1px solid rgba(228,220,209,.4)}
.ft-links{display:flex;flex-wrap:wrap;gap:4px 28px;justify-content:flex-end}
.ft .ft-cta{color:#28333E}
.ft .ft-cta .arr{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ft .ft-cta:hover .arr{transform:translateX(4px)}
.ft a{text-decoration:none;color:#28333E;padding:12px 0}
.ft a:hover{color:#28333E}

/* gallery — ref 2 */
.gal{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:25;background:#FFFFFF;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:24px;animation:fade .35s ease both}
.gal-top{display:grid;grid-template-columns:1fr 1fr;align-items:center}
.gal-top .r{justify-self:end}
.gal-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:32px;min-height:0}
.gal-stage{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:12px}
.gal-stage img{max-height:100%;max-width:min(62vw,1000px);width:auto;height:auto;object-fit:contain;animation:fade .6s ease both}
.gal-mid .r{justify-self:end;text-align:right}
.gal-bot{display:flex;justify-content:space-between;align-items:center;height:72px}
.tbtn{background:none;border:0;padding:12px 0;min-height:44px;cursor:pointer;font:400 14px 'Libre Franklin',sans-serif;color:#28333E}
.tbtn:hover{color:#28333E}

/* hover: underline draws in from the left, retracts to the right */
.lnk,.tbtn,.ft a,.ct-list a,.menu-btn,.mnav a.big,.idx a,.card .t span:first-child,.next .serif{text-decoration:none;background:linear-gradient(currentColor,currentColor) 100% calc(100% - var(--ul, 0px))/0 1px no-repeat;transition:background-size .55s cubic-bezier(.2,.7,.2,1),color .3s ease}
.lnk:hover,.lnk:focus-visible,.tbtn:hover,.tbtn:focus-visible,.ft a:hover,.ft a:focus-visible,.ct-list a:hover,.ct-list a:focus-visible,.menu-btn:hover,.mnav a.big:hover,.idx a:hover,.card:hover .t span:first-child,.card:focus-visible .t span:first-child,.next:hover .serif{background-size:100% 1px;background-position:0 calc(100% - var(--ul, 0px))}
.mnav a.big{width:fit-content}
.tbtn:hover{color:#28333E}
@media (prefers-reduced-motion: reduce){.lnk,.tbtn,.ft a,.ct-list a,.menu-btn,.mnav a.big,.idx a,.card .t span:first-child,.next .serif{transition:none}}
:focus-visible{outline:1px solid #28333E;outline-offset:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.in{animation:up 1.2s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}
@supports (animation-timeline: view()){
.rv{animation:up linear both;animation-timeline:view();animation-range:entry 5% entry 40%}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.in,.rv,.mnav,.gal,.gal-stage img{animation:none !important}.ph img,.slide{transition:none}}

@media (max-width:900px){
.hero{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;max-height:none;row-gap:40px;padding-top:24px;padding-bottom:64px}
.hero .stage{order:-1;justify-self:center;height:auto;width:min(100%,520px);min-height:0}
.hero .side.r{justify-self:center;text-align:center}
.hero .spacer{display:none}
.dots{bottom:-34px}
}
@media (max-width:760px){
.hdr{grid-template-columns:auto 1fr;height:48px}
.hdr .l,.hdr .r .lnk{display:none}
.menu-btn{display:block}
.hdr .logo{order:-1}
.hdr .logo img{height:15px}
.collage{aspect-ratio:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.collage .it,.collage .cap{position:static;width:auto}
.collage .cap{grid-column:1/3}
.i2{grid-column:1/3}
.i3{margin-top:40px}
.row{display:flex;flex-direction:column}
.pc > .card-f,.pc > .card-b{width:94%}
.pc > .card-b{margin-top:-6%}
.card-b{aspect-ratio:auto;min-height:0}
.card-b{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
.card-b .wm{grid-column:1;grid-row:1;justify-self:end}
.card-b .addr{grid-column:1;grid-row:3;padding:28px 10% 0 0}
.card-b .stamp{grid-row:4;margin-top:24px}
.card-b .lines{font-size:14px}
.card-b .contact{font-size:12px}
.p2{width:84%;align-self:flex-end}
.p3{width:62%;margin-top:72px}
.p4{width:100%}
.p4note{margin:24px 0 0}
.bleed .ph{aspect-ratio:4/3}
.ct{display:flex;flex-direction:column;align-items:stretch}
.ct .img{width:72%}
.ct .txt{margin-top:48px}
.ct-list{grid-template-columns:1fr}
.ct-list div{padding:16px 0;border-bottom:1px solid rgba(228,220,209,.6)}
.gal{top:48px}
.gal-mid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;row-gap:12px}
.gal-mid .r{justify-self:start;text-align:left}
.gal-stage img{max-width:100%}
}
.lnk,.tbtn,.ft a{--ul:12px}.idx a,.ct-list a,.mnav a.big{--ul:4px}

/* hover: hairline, soft */
.lnk,.tbtn,.ft a,.ct-list a,.menu-btn,.mnav a.big,.idx a,.card .t span:first-child,.next .serif{--hl:color-mix(in srgb,currentColor 40%,transparent);background:linear-gradient(var(--hl),var(--hl)) 0 100%/0 1px no-repeat content-box;transition:background-size .8s cubic-bezier(.22,.61,.36,1)}
.lnk:hover,.lnk:focus-visible,.tbtn:hover,.tbtn:focus-visible,.ft a:hover,.ft a:focus-visible,.ct-list a:hover,.ct-list a:focus-visible,.menu-btn:hover,.menu-btn:focus-visible,.mnav a.big:hover,.idx a:hover,.idx a:focus-visible,.card:hover .t span:first-child,.card:focus-visible .t span:first-child,.next:hover .serif{background-size:100% 1px;background-position:0 100%}
.idx a{width:fit-content}
@media (prefers-reduced-motion:reduce){.lnk,.tbtn,.ft a,.ct-list a,.menu-btn,.mnav a.big,.idx a,.card .t span:first-child,.next .serif{transition:none}}
/* footer: mobile */
@media (max-width:760px){.ft{flex-direction:column;align-items:flex-start;gap:4px;padding-block:20px 24px}.ft-links{justify-content:flex-start;flex-direction:column;gap:0}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="v tone-{{tone}}">

<header class="hdr wrap">
<nav class="l" aria-label="Principal">
<a class="lnk" href="index.html" onClick="{{goHome}}">Início</a>
<a class="lnk" href="historias.html">Histórias</a>
</nav>
<a href="index.html" class="logo" aria-label="Velune — página inicial" onClick="{{goHome}}"><img src="assets/logo.svg" alt="Velune"></a>
<div class="r">
<a class="lnk" href="#sobre" onClick="{{closeGal}}">Sobre</a>
<a class="lnk" href="#contato" onClick="{{closeGal}}">Contato</a>
<button type="button" class="menu-btn" aria-label="Abrir menu" onClick="{{openMenu}}">Menu</button>
</div>
</header>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="mnav" role="dialog" aria-modal="true" aria-label="Menu">
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px">
<img src="assets/logo.svg" alt="Velune" style="height: 20px; width: auto">
<button type="button" class="menu-btn" style="display: block" onClick="{{closeMenu}}">Fechar</button>
</div>
<nav aria-label="Menu móvel" style="margin-top: auto; margin-bottom: auto">
<a class="big" href="index.html" onClick="{{goHome}}">Início</a>
<a class="big" href="historias.html">Histórias</a>
<a class="big" href="#sobre" onClick="{{closeMenu}}">Sobre</a>
<a class="big" href="#contato" onClick="{{closeMenu}}">Contato</a>
</nav>
<div class="mute" style="display: flex; justify-content: space-between; font-size: 13px">
<span>Afeto &amp; memórias</span>
<a href="https://instagram.com/velune.fotografia" style="text-decoration: none">@velune.fotografia</a>
</div>
</div>
</sc-if>

<main>
<!-- PORTFOLIO -->
<h1 id="inicio" class="sr">Velune — Registros de marcas feitas no tempo, por Fellipe &amp; Natalia Gomes</h1>
<section class="hero-sl" aria-label="Fotografias em destaque" aria-roledescription="carrossel">
<sc-for list="{{slides}}" as="s" hint-placeholder-count="8">
<div class="sl" style="opacity: {{s.op}}" aria-hidden="{{s.hidden}}"><img src="{{s.src}}" alt="{{s.alt}}"></div>
