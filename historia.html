html{scroll-behavior:smooth}

.wrap{padding-inline:clamp(20px,3.4vw,48px)}
.ph{overflow:hidden;background:#E4DCD1}
.ph img{width:100%;height:100%;object-fit:cover}
.tone-pb .ph img{filter:grayscale(1)}
.lnk{text-decoration:none;color:#28333E;padding:12px 0}
.lnk:hover{color:#28333E}
.hdr{position:sticky;top:0;z-index:30;height:52px;font-size:13px;border-bottom:1px solid rgba(228,220,209,.4);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#FFFFFF}

.aside{position:sticky;top:96px;align-self:start}
.aside h1{font-size:21px;line-height:1.3;margin:0 0 4px}
.aside p{margin:24px 0 0;color:#28333E;max-width:30ch}
.seq{display:flex;flex-direction:column;align-items:center;gap:clamp(96px,12vw,180px);padding-bottom:clamp(96px,12vw,180px)}
.seq figure{margin:0}
.f-v{width:min(100%,520px)}.f-v .ph{aspect-ratio:4/5.2}
.f-s{width:min(100%,340px)}.f-s .ph{aspect-ratio:3/4}
.f-w{width:100%}.f-w .ph{aspect-ratio:3/2}
.f-sq{width:min(100%,440px)}.f-sq .ph{aspect-ratio:1/1}
figcaption{margin-top:12px;color:#28333E;font-size:13px}
.quote{font-size:clamp(24px,2.4vw,34px);line-height:1.2;text-align:center;max-width:20ch;margin:0}
.idx{text-align:right;align-self:start;position:sticky;top:96px}
.idx a{display:block;text-decoration:none;color:#28333E;padding:4px 0}
.idx a{opacity:.7}.idx a:hover,.idx a.on{opacity:1}
.next{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px clamp(24px,3vw,48px);text-decoration:none;color:#28333E;padding-block:clamp(56px,7vw,104px);border-top:1px solid rgba(228,220,209,.5)}
.next .txt{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.next .k{font-size:12px;letter-spacing:.04em;color:#28333E}
.next .serif{font-size:clamp(24px,2.2vw,32px);line-height:1.15;letter-spacing:0;width:fit-content}
.next .cover{flex:0 0 auto;width:clamp(140px,16vw,220px);aspect-ratio:4/5;overflow:hidden;background:#E4DCD1}
.next .cover img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.next:hover .cover img,.next:focus-visible .cover img{transform:scale(1.04)}
.next .go{grid-column:1;grid-row:2;justify-self:start;font-size:13px;color:#28333E}
.next .go .arr{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.next:hover .go .arr{transform:translateX(6px)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:52px;padding-block:8px;flex-wrap:wrap;font-size:12px;color:#28333E;border-top:1px solid rgba(228,220,209,.4)}
.ft-links{display:flex;flex-wrap:wrap;gap:4px 28px;justify-content:flex-end}
.ft .ft-cta{color:#28333E}
.ft .ft-cta .arr{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ft .ft-cta:hover .arr{transform:translateX(4px)}
.ft a{text-decoration:none;color:#28333E;padding:12px 0}
.ft a:hover{color:#28333E}
/* hover: underline draws in from the left, retracts to the right */

.lnk:hover,.lnk:focus-visible,.tbtn:hover,.tbtn:focus-visible,.ft a:hover,.ft a:focus-visible,.ct-list a:hover,.ct-list a:focus-visible,.menu-btn:hover,.mnav a.big:hover,.idx a:hover,.card:hover .t span:first-child,.card:focus-visible .t span:first-child,.next:hover .serif{background-size:100% 1px;background-position:0 calc(100% - var(--ul, 0px))}
.mnav a.big{width:fit-content}
.tbtn:hover{color:#28333E}

:focus-visible{outline:1px solid #28333E;outline-offset:4px}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.in{animation:up 1.2s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline: view()){.rv{animation:up linear both;animation-timeline:view();animation-range:entry 5% entry 40%}}

.layout{grid-template-columns:1fr}
.aside,.idx{position:static}
.idx{display:none}
.seq{margin-top:56px;gap:72px}

.mnav a.big{font-family:'Libre Caslon Display',Georgia,serif;font-size:38px;line-height:1.3;text-decoration:none;display:block;padding:4px 0;width:fit-content;color:#28333E}
@keyframes fade{from{opacity:0}to{opacity:1}}

<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="v tone-{{tone}}">
<header class="hdr wrap">
<nav class="l" aria-label="Principal">
<a class="lnk" href="index.html">Início</a>
<a class="lnk" href="historias.html">Histórias</a>
</nav>
<a href="index.html" class="logo" aria-label="Velune — página inicial"><img src="assets/logo.svg" alt="Velune"></a>
<div class="r">
<a class="lnk" href="index.html#sobre">Sobre</a>
<a class="lnk" href="#contato">Contato</a>
<button type="button" class="menu-btn" aria-label="Abrir menu" onClick="{{openMenu}}">Menu</button>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div class="mnav" role="dialog" aria-modal="true" aria-label="Menu">
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px">
<img src="assets/logo.svg" alt="Velune" style="height: 20px; width: auto">
<button type="button" class="menu-btn" style="display: block" onClick="{{closeMenu}}">Fechar</button>
</div>
<nav aria-label="Menu móvel" style="margin-top: auto; margin-bottom: auto">
<a class="big" href="index.html">Início</a>
<a class="big" href="historias.html">Histórias</a>
<a class="big" href="index.html#sobre">Sobre</a>
<a class="big" href="#contato" onClick="{{closeMenu}}">Contato</a>
</nav>
<div class="mnav-foot" style="display: flex; justify-content: space-between; font-size: 13px; color: #28333E">
<span>Afeto &amp; memórias</span>
<a href="https://www.instagram.com/velune.fotografia/" target="_blank" rel="noopener" style="text-decoration: none">@velune.fotografia</a>
</div>
</div>
</sc-if>

<main class="wrap">
<div class="layout">
<div class="aside in">
<div class="mute" style="font-size: 12px; letter-spacing: 0.04em; margin-bottom: 10px">Histórias</div>
<h1 class="serif">{{s.title}}</h1>
<div class="mute">{{s.meta}}</div>
<p>{{s.count}}</p>
</div>

<div class="seq">
<sc-for list="{{s.imgs}}" as="im" hint-placeholder-count="9">
<figure class="{{im.cls}}"><div class="ph"><img src="{{im.src}}" alt="{{im.alt}}" loading="lazy"></div></figure>
</sc-for>
</div>

<nav class="idx" aria-label="Outras histórias">
<sc-for list="{{index}}" as="x" hint-placeholder-count="10">
<a class="{{x.cls}}" href="historia.html#{{x.slug}}" onClick="{{x.go}}">{{x.title}}</a>
</sc-for>
</nav>
</div>

<a class="next" href="historia.html#{{nx.slug}}" onClick="{{goNext}}">
<span class="cover"><img src="{{nx.cover}}" alt=""></span>
<span class="txt">
<span class="k">Próxima história</span>
<span class="serif">{{nx.title}}</span>
</span>
</a>
</main>

<footer id="contato" class="ft wrap">
<span>© 2026 Velune</span>
<nav class="ft-links" aria-label="Contato">
<a href="https://www.instagram.com/velune.fotografia/" target="_blank" rel="noopener">@velune.fotografia</a>
<a href="https://wa.me/5584998706493" target="_blank" rel="noopener">(84) 9 9870-6493</a>
</nav>
</footer>
</div>
</template>
